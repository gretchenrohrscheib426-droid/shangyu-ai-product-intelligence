name: Offline secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan working tree without printing secret values
        run: python scripts/check_release.py --secrets-only
      - name: Additional credential, entropy and privacy checks
        run: python scripts/security_scan.py
